name: Foundry Tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Required: the Pyth Solidity SDK is an npm dependency, remapped from node_modules/ in foundry.toml
      - name: Install npm dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      # Fork tests run only when the FORK_RPC_URL secret is set (Arbitrum One archive RPC); otherwise they skip
      - name: Run Forge tests
        env:
          FORK_RPC_URL: ${{ secrets.FORK_RPC_URL }}
        run: |
          forge test -vvv
        id: test
